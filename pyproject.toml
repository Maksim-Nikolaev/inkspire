[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inkspire"
dynamic = ["version"]
description = "Trace line art by moving the mouse along extracted contours"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "fonttools>=4.40",
    "customtkinter>=6.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "detection", "drawing", "ui"]

[tool.setuptools.package-data]
ui = ["icons/*.png", "icons/*.ico"]

[tool.setuptools.dynamic]
version = {attr = "core.version.__version__"}

[project.scripts]
inkspire = "main:main"

[project.gui-scripts]
inkspire-gui = "main:main"
