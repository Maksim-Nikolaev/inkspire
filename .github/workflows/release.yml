name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            asset: inkspire.tar.gz
          - os: windows-latest
            name: windows
            asset: inkspire.exe
          - os: macos-15
            name: macos-arm64
            asset: inkspire-macos-arm64.dmg
          - os: macos-15-intel
            name: macos-x86_64
            asset: inkspire-macos-x86_64.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v7

      # 3.13 on purpose: the 3.14 installers bundle Tk 9, which CustomTkinter is not tested against.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Import signing certificate (macOS, optional)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "INKSPIRE_CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build
        run: pyinstaller --noconfirm inkspire.spec

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libxtst6
          timeout 120 xvfb-run -a dist/inkspire --self-test

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dist\inkspire.exe -ArgumentList '--self-test' -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); throw "self-test timed out" }
          if ($proc.ExitCode -ne 0) { throw "self-test exited with $($proc.ExitCode)" }

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: perl -e 'alarm shift; exec @ARGV' 120 dist/Inkspire.app/Contents/MacOS/Inkspire --self-test

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/inkspire
          tar -czf dist/${{ matrix.asset }} -C dist inkspire

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict dist/Inkspire.app
          packaging/make_dmg.sh dist/Inkspire.app dist/${{ matrix.asset }}

      - name: Sign and notarize DMG (macOS, optional)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && env.NOTARY_KEY != ''
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          codesign --sign "$MACOS_CODESIGN_IDENTITY" --timestamp dist/${{ matrix.asset }}
          xcrun notarytool submit dist/${{ matrix.asset }} --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: inkspire-${{ matrix.name }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
